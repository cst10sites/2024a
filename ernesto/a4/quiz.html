<script>

	function HTML() {
		var Hypertext = document.getElementById('Hypertext').checked // correct
		var Home = document.getElementById('Home').checked // incorrect

		if (Hypertext == true && Home == false && Hyperlinks == false){

		}

		}
	}


	function Heading() {
