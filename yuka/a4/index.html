<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignment 4</title>
<link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
  <div>
<h2>Cookie Clicker Game</h2>
<p style="font-size: 20px;" id="cpsDisplay"></p>
<button onclick="updateCPS();">
<img src="https://img00.deviantart.net/b0f0/i/2015/175/0/0/cookie_by_lilla_123-d8ynmga.png" style="width:150px;height:150px;"></button>
<p id="clicksDisplay"></p>

<hr>
<h2>HTML/CSS/JS Quiz</h2>
<p>Click <a href="quiz.html">here</a> to play the quiz.</p>
</div>

<script>
// global variables
var nClicks = 0;
var startTime = new Date().getTime();
var resets = 0;

function updateCPS() {
  if (nClicks == 0) {
    // first click
    startTime = new Date().getTime();
    nClicks = nClicks + 1
  }
  else {
    // subsequent clicks:
    var currentTime = new Date().getTime();
    var timeElapsed = (currentTime - startTime) / 1000;
    document.getElementById('cpsDisplay').innerHTML = "Clicks per second: " + (nClicks / timeElapsed).toFixed(2);
    nClicks = nClicks + 1;
    // total clicks calculation
    var totalClicks = nClicks + (24*resets);
    document.getElementById('clicksDisplay').innerHTML = "Total clicks: " + totalClicks;
  }
  if (nClicks %25 == 0) {
    // reset game after 25 clicks
    nClicks = 0
    startTime = new Date().getTime();
    nClicks = nClicks + 1
    resets = resets + 1
  }
}
</script>
</body>
</html>
