<script>
function checkRadio() {
    var correctAnswerSelected = document.getElementById("correctAnswer").checked;
    if (correctAnswerSelected == true) {
        alert("Correct!");
    }
    else{

}

function checkHead() {
    var h2 = document.getElementById("h2").checked; 
    var h1 = document.getElementById("h1").checked; //correct
    var head = document.getElementById("head").checked;
    var heading = document.getElementById("heading").checked;

}
