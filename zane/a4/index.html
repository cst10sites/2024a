<body>

<h2>Cookie Clicker</h2>

<button onclick="updateCPS();"><img style="width: 300px; height: 300px " src="cookie.png" alt="cookiebutton"></button>

<p id="cpsDisplay"></p>

 

<hr>

<h2>HTML/CSS/JS Quiz</h2>

<p>Click <a href="cookie.html">here</a> to play the quiz.</p>

 

<script>

// global variables

var nClicks = 0;

var startTime = new Date().getTime();

 

function updateCPS() {

                if (nClicks == 0) {

                                // first click

                                startTime = new Date().getTime();

                                nClicks = nClicks + 1

                                // 1. reset startTime

                                // 2. increase nClicks by 1

                }

                else {

                                var currentTime = new Date().getTime();

                                var timeElapsed = (currentTime - startTime) / 1000;

                                document.getElementById('cpsDisplay').innerHTML = "Clicks Per Second: " + (nClicks / timeElapsed).toFixed(2);

                                nClicks = nClicks + 1

 

                                // subsequent clicks:

                                // 1. create variable currentTime

                                // 2. create variable timeElapsed and subtract start and currentTime

                                // 3. calculate CPS = nClicks ÷ timeElapsed

                                //    BUT timeElapsed be measured in seconds (not milliseconds)

                                // 4. display CPS using id

                                // 5. increase nClicks by 1

 

 

                }

                if (nClicks % 25 == 0){

                                // reset game after 25 clicks

                                nClicks = 0

                                // 1. reset startTime

                                // 2. increase nClicks by 1

 

                }

 

}

 

</script>
