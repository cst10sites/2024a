<script>
// global variables
var nClicks = 0;
var startTime = new Date().getTime();
var tClicks = 0;

function updateCPS() {
	if (nClicks == 0){
		startTime = new Date().getTime();
		nClicks = 1;


															
	}
	else {
		// subsequent clicks:
		currentTime = new Date().getTime();												
		var timeElapsed = (currentTime - startTime) / 1000					
		document.getElementById('cpsDisplay').innerHTML = nClicks / timeElapsed + " clicks per second"  			
		nClicks = nClicks + 1;													 
	}
}
function showNumberOfClicks() {
				tClicks = tClicks + 1;
				document.getElementById('showNumberOfClicks').innerHTML = tClicks;
			}






</script>
