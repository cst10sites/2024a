<p>What 2 combined create a link that opens a new tab?</p>
<form>
    <!--Need to add multiple id for JavaScript to work-->
    <!--choice 1-->
    <input type="checkbox" id="ahref">
    <label>&lt;a href="url">&lt;/a></label>

    <input type="checkbox" id="a">

<script>

// Radio button
function checkRadio() {
	var correctAnswerSelected = document.getElementById('correctAnswer').checked;
	// alert(correctAnswerSelected); // true or false
	if (correctAnswerSelected == true) {
		alert("Correct!");
	}
	else {
		alert("Sorry, try again.");
	}

}
// Dropbox
function checkColor() {
	var color = document.getElementById("colorOption").value 
	// alert(car);
	document.getElementById("colorDisplay").innerHTML = "No, " + color + " is not the right answer.";
	
	if (color == "Background-colour:") {
		document.getElementById("colorDisplay").innerHTML = "Yes! " + color + " is right!";
	}
}

// Checkbox
function checkLink() {
    var ahref = document.getElementById("ahref").checked; // correct
    var a = document.getElementById("a").checked;
    var linkhref = document.getElementById("linkhref").checked;
    var target = document.getElementById("target").checked; // correct

    if (ahref == true && target == true && a == false && linkhref == false) {
        // && means and (all conditions need to be true)
        alert("Correct!");
    }
    else {
        alert("Try again!");
    }
}

// Text box
function submitForm() {
	alert("Thanks, have a nice day!")
}
